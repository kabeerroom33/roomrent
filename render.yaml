services:
  - type: web
    name: roomrent
    env: python
    region: oregon
    rootDir: .
    buildCommand: pip install -r rent-app/requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ROOM_NAME
        value: Room 33
      - key: RENDER
        value: true
      - key: ADMIN_PASSWORD_HASH
        sync: false

    healthCheckPath: /health
