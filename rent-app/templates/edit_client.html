{% extends "base.html" %}
{% block title %}Edit {{ client.name }} — Rent Manager{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <div style="font-size:.85rem;margin-bottom:.25rem;">
      <a href="{{ url_for('client_detail', client_id=client.id) }}" style="color:var(--secondary);text-decoration:none;">← Back to Client</a>
    </div>
    <div class="page-title">✏️ Edit Client #{{ "%04d"|format(client.id) }}</div>
  </div>
</div>

<div class="card" style="max-width:600px;">
  <form method="post" action="{{ url_for('edit_client', client_id=client.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
    <div class="form-group">
      <label>Full Name *</label>
      <input type="text" name="name" value="{{ client.name }}" required/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="text" name="mobile" value="{{ client.mobile or '' }}" placeholder="+971 50 000 0000"/>
      </div>
      <div class="form-group">
        <label>Room / Bed No</label>
        <input type="text" name="room_no" value="{{ client.room_no or 'Room 33' }}" placeholder="Room / bed"/>
      </div>
    </div>
    <div class="form-group">
      <label>Monthly Rent (AED)</label>
      <input type="number" name="monthly_rent" value="{{ client.monthly_rent }}" min="0" step="0.01"/>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <input type="text" name="notes" value="{{ client.notes or '' }}"/>
    </div>
    <div class="btn-group">
      <button type="submit" class="btn btn-success">✔ Save Changes</button>
      <a href="{{ url_for('client_detail', client_id=client.id) }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
