{% extends "base.html" %}
{% block title %}Add Client — Rent Manager{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <div style="font-size:.85rem;margin-bottom:.25rem;">
      <a href="{{ url_for('dashboard') }}" style="color:var(--secondary);text-decoration:none;">← Dashboard</a>
    </div>
    <div class="page-title">➕ Add New Client</div>
  </div>
</div>

<div class="card" style="max-width:600px;">
  <form method="post" action="{{ url_for('add_client') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
    <div class="form-group">
      <label>Full Name *</label>
      <input type="text" name="name" required placeholder="e.g. JOHN DOE" autofocus/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="text" name="mobile" placeholder="+971 50 000 0000"/>
      </div>
      <div class="form-group">
        <label>Room / Bed No</label>
        <input type="text" name="room_no" value="Room 33" placeholder="Room / bed"/>
      </div>
    </div>
    <div class="form-group">
      <label>Monthly Rent (AED)</label>
      <input type="number" name="monthly_rent" value="525" min="0" step="0.01"/>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <input type="text" name="notes" placeholder="Any additional notes…"/>
    </div>
    <div class="btn-group">
      <button type="submit" class="btn btn-success">✔ Add Client</button>
      <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
